interface:
  display_name: "TrayPage"
  short_description: "Create, publish, and revise TrayPage pages"
  default_prompt: "Use $traypage to create this as a TrayPage page, publish it when ready, and start a foreground connected review session with traypage review start --watch if the TrayPage CLI is available; use --open only if the installed CLI supports it."

policy:
  allow_implicit_invocation: true
